{% extends "blog/base.html" %}

{% block title %}Posts{% endblock %}

{% block content %}
<h2>Blog Posts</h2>

{% for post in posts %}
    <div style="border:1px solid #ccc; padding:10px; margin-bottom:10px;">
        <h3>{{ post.title }}</h3>
        <p>{{ post.content }}</p>
        <small>{{ post.created_at }}</small>
    </div>
{% empty %}
    <p>No posts yet.</p>
{% endfor %}

{% endblock %}
