{% extends "blog/base.html" %}

{% block content %}
<h2>{{ post.title }}</h2>
<p>{{ post.body }}</p>

<hr>

<h3>Comments</h3>
{% for comment in comments %}
    <p><strong>{{ comment.name }}</strong> said:</p>
    <p>{{ comment.body }}</p>
    <hr>
{% empty %}
    <p>No comments yet.</p>
{% endfor %}

<h3>Add a Comment</h3>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Submit Comment</button>
</form>
{% endblock %}
